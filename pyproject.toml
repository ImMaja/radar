[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-foodtruck"
version = "0.1.0"
description = "Private web application for discovering food-truck opportunities."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic==1.19.2",
    "argon2-cffi==25.1.0",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.scripts]
radar-admin = "radar.cli:main"
radar-worker = "radar.worker:main"

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the dedicated PostgreSQL/PostGIS test database",
]
